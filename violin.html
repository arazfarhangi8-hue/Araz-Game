<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>آموزش ویولن | Araz Game</title>
<style>
body{font-family:Tahoma,sans-serif;background:#f5f9ff;text-align:center;margin:0}
header{background:linear-gradient(90deg,#0066ff,#fff,#ff3333);padding:25px}
.card{background:#fff;max-width:760px;margin:30px auto;padding:20px;border-radius:15px;box-shadow:0 0 10px #ccc}
.lesson-list p{font-size:18px}#status{margin:20px;color:#000;font-size:18px}.media{max-width:100%;max-height:65vh;border-radius:12px}video{width:100%;background:#000}
button{background:#0066ff;color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:18px;cursor:pointer;margin:7px}button:disabled{opacity:.45}.back{background:#444}
</style></head>
<body>
<header><h1>🎻 آموزش ویولن</h1><p>به بخش آموزش ویولن سایت Araz Game خوش آمدید.</p></header>
<div class="card">
<div class="lesson-list">
<h2>درس‌های آینده</h2>
<p>🎼 آشنایی با ویولن</p><p>🎵 آموزش نت‌ها</p><p>🎻 طرز صحیح گرفتن ویولن و آرشه</p><p>🎶 تمرین‌های ساده</p>
</div>
<hr>
<h2>🎬 فیلم‌ها و عکس‌های آموزش ویولن</h2>
<div id="status">در حال بارگذاری...</div><div id="media"></div>
<button id="prev" onclick="move(-1)">صفحه قبلی</button><button id="next" onclick="move(1)">صفحه بعدی</button>
<br><button class="back" onclick="location.href='index.html'">🏠 بازگشت به صفحه اصلی</button>
</div>
<script>
const api='https://api.github.com/repos/arazfarhangi8-hue/Araz-Game/contents/videos/violin';
let files=[],index=0;const videoExt=['mp4','webm','ogg','mov','m4v'],imageExt=['jpg','jpeg','png','gif','webp'];
function title(n){return n.replace(/\.[^/.]+$/,'').replace(/[-_]+/g,' ').trim()||'درس ویولن'}
async function load(){try{const r=await fetch(api,{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();files=d.filter(x=>x.type==='file'&&(videoExt.includes(x.name.split('.').pop().toLowerCase())||imageExt.includes(x.name.split('.').pop().toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!files.length){empty();return}show(0)}catch(e){empty()}}
function empty(){status.textContent='هنوز هیچ فیلمی منتشر نشده است.';media.innerHTML='';prev.disabled=true;next.disabled=true}
function show(i){index=i;status.textContent='در حال بارگذاری...';media.innerHTML='';setTimeout(()=>{const f=files[index],ext=f.name.split('.').pop().toLowerCase();status.textContent=title(f.name);media.innerHTML=videoExt.includes(ext)?'<video class="media" controls playsinline src="'+f.download_url+'"></video>':'<img class="media" src="'+f.download_url+'" alt="'+title(f.name)+'">';prev.disabled=index===0;next.disabled=index===files.length-1},500)}
function move(s){if(files.length)show(index+s)}load();
</script></body></html>
