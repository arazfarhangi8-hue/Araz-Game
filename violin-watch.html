<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="تماشای فیلم‌های آموزش ویولن در سایت Araz Game.">
<title>تماشا در سایت Araz Game | آموزش ویولن</title>
<style>
*{box-sizing:border-box}
body{font-family:Tahoma,sans-serif;background:#f5f9ff;text-align:center;margin:0;color:#172033;line-height:1.8}
header{background:linear-gradient(90deg,#0066ff,#fff,#ff3333);padding:22px 14px}
main{width:calc(100% - 24px);max-width:1000px;margin:24px auto}
.intro,.video-card{background:#fff;border-radius:15px;box-shadow:0 0 10px #ddd;padding:18px;margin:16px auto}
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.video-card{text-align:right;margin:0;min-width:0}
.video-card h2{font-size:19px;margin:0 0 12px;overflow-wrap:anywhere}
video{display:block;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;object-fit:contain}
.empty-screen{width:100%;max-width:800px;min-height:220px;margin:16px auto;background:#050505;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;padding:16px;font-size:clamp(19px,3vw,28px);font-weight:bold}
.back-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:24px 0}
.back{display:inline-block;text-decoration:none;background:#0066ff;color:#fff;border-radius:9px;padding:12px 17px;font-size:16px}
.back:hover{background:#0044aa}
.small{color:#555;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🎻 تماشا در سایت Araz Game</h1>
<p id="subtitle">فیلم‌های آموزشی ویولن</p>
</header>
<main>
<section class="intro">
<h2 id="page-heading">🎬 همهٔ ویدیوها</h2>
<p id="page-instruction">فیلم‌هایی که در پوشه‌های موضوعی سایت منتشر شده‌اند، خودکار اینجا نمایش داده می‌شوند.</p>
</section>
<div id="videos" class="videos"></div>
<div class="back-row">
<a class="back" id="back-to-list" href="violin-videos.html">↩ بازگشت به فیلم‌های آموزشی</a>
<a class="back" href="violin.html">🎻 بازگشت به آموزش ویولن</a>
<a class="back" href="index.html">🏠 بازگشت به صفحه اصلی</a>
</div>
</main>
<script>
const OWNER = "arazfarhangi8-hue";
const REPO = "Araz-Game";
const ROOT_FOLDER = "violin-videos";
const BRANCH = "main";
const TOPICS = {
  intro:   {title:"🎼 آشنایی با ویولن و اجزای آن", folder:"ashnaei-ba-violin"},
  notes:   {title:"🎵 آموزش نت‌ها و نت‌خوانی", folder:"amoozesh-net-ha"},
  holding: {title:"🎻 طرز صحیح گرفتن ویولن و آرشه", folder:"gereftan-violin-arche"},
  practice:{title:"🎶 تمرین‌های ساده ویولن", folder:"tamrin-haye-sade"},
  songs:   {title:"🎵 آهنگ‌ها", folder:"ahang-ha"}
};
const params = new URLSearchParams(location.search);
const topic = params.get("topic") || "all";
const selected = TOPICS[topic];
const container = document.getElementById("videos");
const heading = document.getElementById("page-heading");
const subtitle = document.getElementById("subtitle");
const instruction = document.getElementById("page-instruction");
const backList = document.getElementById("back-to-list");

if (selected) {
  heading.textContent = selected.title;
  subtitle.textContent = selected.title;
  instruction.textContent = "فیلم‌های این موضوع که در پوشهٔ مخصوص آن منتشر شده‌اند، خودکار اینجا نمایش داده می‌شوند.";
  backList.href = "violin-videos.html?topic=" + encodeURIComponent(topic);
} else {
  heading.textContent = "🎬 همهٔ ویدیوها";
  subtitle.textContent = "همهٔ فیلم‌های آموزش ویولن";
}

document.title = (selected ? selected.title.replace(/[🎼🎵🎻🎶]/g,"").trim() : "همهٔ فیلم‌ها") + " | تماشا در Araz Game";

function getTitle(filename) {
  return filename
    .replace(/\.(mp4|webm|ogg|m4v|mov)$/i, "")
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function getSiteVideoUrl(folder, filename) {
  return "https://" + OWNER + ".github.io/" + REPO + "/" + ROOT_FOLDER + "/" + folder + "/" +
    filename.split("/").map(part => encodeURIComponent(part)).join("/");
}
function showMessage(message) {
  container.replaceChildren();
  const empty = document.createElement("div");
  empty.className = "empty-screen";
  empty.textContent = message;
  container.appendChild(empty);
}
async function fetchFolderVideos(config) {
  const path = ROOT_FOLDER + "/" + config.folder;
  const url = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + path + "?ref=" + BRANCH;
  const response = await fetch(url, {cache:"no-store"});
  if (!response.ok) throw new Error("Unable to read folder " + config.folder);
  const files = await response.json();
  if (!Array.isArray(files)) throw new Error("Invalid listing for " + config.folder);
  return files
    .filter(file => file.type === "file" && /\.(mp4|webm|ogg|m4v|mov)$/i.test(file.name))
    .map(file => ({file, config}))
    .sort((a,b) => a.file.name.localeCompare(b.file.name,"fa"));
}
function renderVideo(entry) {
  const {file, config} = entry;
  const card = document.createElement("article");
  card.className = "video-card";
  const title = document.createElement("h2");
  title.textContent = "🎬 " + getTitle(file.name);
  const category = document.createElement("p");
  category.className = "small";
  category.textContent = config.title.replace(/[🎼🎵🎻🎶]/g,"").trim();
  const player = document.createElement("video");
  player.controls = true;
  player.preload = "metadata";
  player.playsInline = true;
  player.src = getSiteVideoUrl(config.folder, file.name);
  player.setAttribute("aria-label", getTitle(file.name));
  card.append(title, category, player);
  container.appendChild(card);
}
async function loadVideos() {
  showMessage("در حال بارگذاری ویدیوها…");
  try {
    const configs = selected ? [selected] : Object.values(TOPICS);
    const groups = await Promise.all(configs.map(fetchFolderVideos));
    const videos = groups.flat();
    if (!videos.length) {
      showMessage("ویدیویی آپلود نشده است");
      return;
    }
    container.replaceChildren();
    videos.forEach(renderVideo);
  } catch (_) {
    showMessage("بارگذاری فهرست ویدیوها انجام نشد. کمی بعد دوباره تلاش کن.");
  }
}
loadVideos();
</script>
</body>
</html>
