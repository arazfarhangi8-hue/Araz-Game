<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>آموزش ویولن | Araz Game</title>
<style>
body{margin:0;font-family:Tahoma,sans-serif;background:#f5f9ff;text-align:center}
header{background:linear-gradient(90deg,#0066ff,#fff,#ff3333);padding:25px}
.box{background:#fff;width:90%;max-width:700px;margin:30px auto;padding:25px;border-radius:18px;box-shadow:0 0 12px #ccc}
#title{font-size:30px}#status{font-size:22px;font-weight:bold;margin:15px}
#loading{font-size:20px;color:#555;margin:25px}.media{max-width:100%;max-height:60vh;border-radius:12px;margin:20px auto;display:block}
button{background:#0066ff;color:#fff;border:0;padding:13px 22px;margin:7px;border-radius:12px;font-size:19px;cursor:pointer}
.back{background:#444}
</style></head>
<body>
<header><h1>🎻 آموزش ویولن</h1></header>
<div class="box">
<h2 id="title"></h2><div id="status">در حال بررسی...</div><div id="loading">در حال بارگذاری...</div>
<div id="media"></div><div id="controls"></div>
<button class="back" onclick="location.href='violin-learning.html'">↩ بازگشت به آموزش ویولن</button>
</div>
<script>
const p=new URLSearchParams(location.search), topic=p.get('topic')||'شناخت-ویولن';
const map={
'شناخت-ویولن':['آشنایی با ویولن','shenakht-violin'],
'نت‌ها':['آموزش نت‌ها','natha'],
'گرفتن-ویولن-و-آرشه':['طرز صحیح گرفتن ویولن و آرشه','gereftan-violin-o-arche'],
'تمرین‌های-ساده':['تمرین‌های ساده','tamrin-haye-sade'],
'آهنگ‌ها':['آهنگ‌ها','ahangha']
};
const item=map[topic]||map['شناخت-ویولن'];
document.getElementById('title').textContent=item[0];
const api='https://api.github.com/repos/arazfarhangi8-hue/Araz-Game/contents/videos/violin/'+item[1];
let files=[],i=0;
function show(){
document.getElementById('loading').style.display=files.length?'block':'none';
document.getElementById('media').innerHTML='';
if(!files.length)return;
setTimeout(()=>{
document.getElementById('loading').style.display='none';
const f=files[i], box=document.getElementById('media');
if(/\.(mp4|webm|ogg)$/i.test(f.name)){const v=document.createElement('video');v.className='media';v.controls=true;v.src=f.download_url;box.appendChild(v);}
else{const img=document.createElement('img');img.className='media';img.src=f.download_url;img.alt=f.name;box.appendChild(img);}
},500);
}
fetch(api).then(r=>r.ok?r.json():[]).then(d=>{
files=Array.isArray(d)?d.filter(f=>f.type==='file'&&/\.(mp4|webm|ogg|jpg|jpeg|png|gif|webp)$/i.test(f.name)):[];
document.getElementById('status').textContent=files.length?'منتشر شد':'منتشر نشده';
if(files.length>1){
const a=document.createElement('button');a.textContent='صفحه قبلی';a.onclick=()=>{i=(i-1+files.length)%files.length;show()};
const b=document.createElement('button');b.textContent='صفحه بعدی';b.onclick=()=>{i=(i+1)%files.length;show()};
document.getElementById('controls').append(a,b);
}
show();
}).catch(()=>{document.getElementById('status').textContent='منتشر نشده';document.getElementById('loading').style.display='none'});
</script></body></html>
