<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>بازی آموزش جدول ضرب ۲ | 🎮 Araz Game</title><style>body{margin:0;font-family:Tahoma,sans-serif;background:#f5f9ff;text-align:center}header{background:linear-gradient(90deg,#0066ff,#ffffff,#ff3333);padding:30px}.box{background:white;width:350px;margin:30px auto;padding:20px;border-radius:15px;box-shadow:0 0 10px gray}input{font-size:20px;width:100px;text-align:center}button{background:#0066ff;color:white;border:none;padding:10px 20px;border-radius:10px;font-size:18px;cursor:pointer}button:hover{background:#0044aa}#result{font-size:22px;margin-top:20px;font-weight:bold}</style><meta name="description" content="بازی آموزش جدول ضرب ۲ برای دانش‌آموزان ابتدایی. یادگیری ضرب با بازی در Araz Game."><meta name="keywords" content="ضرب ۲, جدول ضرب, بازی ضرب, بازی آموزشی ریاضی, Araz Game"><meta name="robots" content="index,follow"><link rel="canonical" href="https://arazfarhangi8-hue.github.io/Araz-Game/zarb2.html"></head><body><header><h1>🎮 شروع بازی</h1><p>بازی آموزش ضرب عدد ۲</p></header><div class="box"><h2>🎲 بازی ضرب عدد ۲</h2><h1 id="question"></h1><input type="number" id="answer"><br><br><button onclick="check()">بررسی جواب</button><br><br><button onclick="location.href='index.html'">🏠 بازگشت به صفحه اصلی</button><button onclick="location.href='start.html'">🎮 انتخاب بازی</button><h2 id="result"></h2><p>امتیاز: <span id="score">0</span></p></div><script>let score=0,n,audioCtx=null;function getAudio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!audioCtx)audioCtx=new A();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function master(c,t,dur){const g=c.createGain();g.gain.setValueAtTime(1.8,t);g.connect(c.destination);return g}function playWinSound(){const c=getAudio();if(!c)return;const t=c.currentTime,notes=[523.25,659.25,783.99,1046.5,783.99,659.25];notes.forEach((f,i)=>{const o=c.createOscillator(),g=master(c,t+i*.13,.13),x=t+i*.13;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(1.8,x);g.gain.exponentialRampToValueAtTime(.002,x+.13);o.connect(g);o.start(x);o.stop(x+.14)})}function playLoseSound(){const c=getAudio();if(!c)return;const o=c.createOscillator(),g=master(c,c.currentTime,.82),t=c.currentTime;o.type='sine';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(90,t+.75);g.gain.setValueAtTime(1.8,t);g.gain.exponentialRampToValueAtTime(.002,t+.82);o.connect(g);o.start(t);o.stop(t+.84)}function newQuestion(){n=Math.floor(Math.random()*10)+1;document.getElementById('question').innerHTML='2 × '+n+' = ؟';document.getElementById('answer').value='';document.getElementById('answer').focus()}function check(){let ans=parseInt(document.getElementById('answer').value);if(ans===2*n){score++;playWinSound();document.getElementById('result').innerHTML='✅ درست بود آفرین!'}else{playLoseSound();document.getElementById('result').innerHTML='❌ جواب درست: '+(2*n)}document.getElementById('score').innerHTML=score;setTimeout(newQuestion,1200)}newQuestion();</script></body></html>
