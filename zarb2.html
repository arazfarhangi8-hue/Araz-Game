<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>بازی آموزش جدول ضرب ۲ | 🎮 Araz Game</title><style>body{margin:0;font-family:Tahoma,sans-serif;background:#f5f9ff;text-align:center}header{background:linear-gradient(90deg,#0066ff,#ffffff,#ff3333);padding:30px}.box{background:white;width:350px;margin:30px auto;padding:20px;border-radius:15px;box-shadow:0 0 10px gray}input{font-size:20px;width:100px;text-align:center}button{background:#0066ff;color:white;border:none;padding:10px 20px;border-radius:10px;font-size:18px;cursor:pointer}button:hover{background:#0044aa}#result{font-size:22px;margin-top:20px;font-weight:bold}</style><meta name="description" content="بازی آموزش جدول ضرب ۲ برای دانش‌آموزان ابتدایی. یادگیری ضرب با بازی در Araz Game."><meta name="keywords" content="ضرب ۲, جدول ضرب, بازی ضرب, بازی آموزشی ریاضی, Araz Game"><meta name="robots" content="index,follow"><link rel="canonical" href="https://arazfarhangi8-hue.github.io/Araz-Game/zarb2.html"></head><body><header><h1>🎮 شروع بازی</h1><p>بازی آموزش ضرب عدد ۲</p></header><div class="box"><h2>🎲 بازی ضرب عدد ۲</h2><h1 id="question"></h1><input type="number" id="answer"><br><br><button onclick="check()">بررسی جواب</button><br><br><button onclick="location.href='index.html'">🏠 بازگشت به صفحه اصلی</button><button onclick="location.href='start.html'">🎮 انتخاب بازی</button><h2 id="result"></h2><p>امتیاز: <span id="score">0</span></p></div><script>
let score=0,n,winAudio=null,loseAudio=null;
async function audioReady(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!winAudio)winAudio=new A;if(winAudio.state==='suspended')await winAudio.resume();return winAudio}
async function playWinSound(){const c=await audioReady();if(!c)return;const now=c.currentTime,notes=[523.25,659.25,783.99,1046.5,783.99,659.25],times=[0,.12,.24,.36,.52,.68];notes.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=now+times[i];o.type='triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.32,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.11);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.12)})}
async function playLoseSound(){const c=await audioReady();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(105,t+.8);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.28,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.85);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.9)}
function newQuestion(){n=Math.floor(Math.random()*10)+1;document.getElementById('question').innerHTML='2 × '+n+' = ؟';document.getElementById('answer').value='';document.getElementById('answer').focus()}
function check(){let ans=parseInt(document.getElementById('answer').value);if(ans===2*n){score++;playWinSound();document.getElementById('result').innerHTML='✅ درست بود آفرین!'}else{playLoseSound();document.getElementById('result').innerHTML='❌ جواب درست: '+(2*n)}document.getElementById('score').innerHTML=score;setTimeout(newQuestion,1200)}newQuestion();
</script></body></html>
