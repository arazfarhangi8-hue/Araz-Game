<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گالری عکس‌های روزانه من | Araz Game 📸</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:tahoma,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);color:white}
.container{width:92%;max-width:1000px;margin:40px auto;padding:30px;background:rgba(255,255,255,.12);border-radius:22px;box-shadow:0 0 25px rgba(0,0,0,.35)}
h1{text-align:center;color:#FFD700;margin-top:0}
.back{display:inline-block;margin-bottom:25px;padding:10px 18px;border-radius:12px;background:#FFD700;color:#1e3c72;text-decoration:none;font-weight:bold;transition:.3s}
.back:hover{transform:scale(1.05)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.gallery img{width:100%;height:220px;object-fit:cover;border-radius:16px;cursor:pointer;transition:transform .3s,box-shadow .3s}
.gallery img:hover{transform:scale(1.04);box-shadow:0 10px 25px rgba(0,0,0,.35)}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:25px}
.modal.show{display:flex}
.modal img{max-width:95%;max-height:88vh;border-radius:16px;animation:zoom .25s ease}
.close{position:absolute;top:18px;left:25px;font-size:40px;color:white;cursor:pointer}
.loading,.empty,.error{text-align:center;padding:30px;color:#eee}
@keyframes zoom{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="container">
<a class="back" href="about.html">⬅️ بازگشت به درباره من</a>
<h1>📸 گالری عکس‌های روزانه من</h1>
<div class="gallery" id="gallery"><div class="loading">در حال بارگذاری عکس‌ها... 📷</div></div>
</div>

<div class="modal" id="modal" onclick="closeModal()">
<span class="close">&times;</span>
<img id="modalImg" src="" alt="عکس بزرگ شد" onclick="event.stopPropagation()">
</div>

<script>
const gallery = document.getElementById('gallery');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');

async function loadGallery(){
  const apiUrl = 'https://api.github.com/repos/arazfarhangi8-hue/Araz-Game/contents/gallery1';
  try{
    const response = await fetch(apiUrl + '?t=' + Date.now(), {
      headers: { 'Accept': 'application/vnd.github+json' },
      cache: 'no-store'
    });

    if(!response.ok) throw new Error('GitHub API error');

    const files = await response.json();
    const images = files.filter(file => file.type === 'file' && /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(file.name));

    gallery.innerHTML = '';

    if(images.length === 0){
      gallery.innerHTML = '<div class="empty">هنوز عکسی در گالری قرار نگرفته است. 📷</div>';
      return;
    }

    images.forEach((file,index)=>{
      const card=document.createElement('div');
      card.style.position='relative';

      const img=document.createElement('img');
      img.src=file.download_url;
      img.alt='عکس آراز '+(index+1);
      img.loading='lazy';
      img.onclick=()=>openModal(file.download_url);

      card.appendChild(img);
      gallery.appendChild(card);
    });
  }catch(error){
    console.error(error);
    gallery.innerHTML='<div class="error">بارگذاری عکس‌ها با مشکل روبه‌رو شد. لطفاً صفحه را دوباره باز کنید.</div>';
  }
}

function openModal(src){
  modalImg.src=src;
  modal.classList.add('show');
}
function closeModal(){
  modal.classList.remove('show');
  modalImg.src='';
}

loadGallery();
</script>
</body>
</html>
