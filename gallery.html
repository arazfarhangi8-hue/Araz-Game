<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گالری عکس‌های روزانه من | Araz Game 📸</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:tahoma, sans-serif;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
}

.container{
    width:92%;
    max-width:1000px;
    margin:40px auto;
    padding:30px;
    background:rgba(255,255,255,.12);
    border-radius:22px;
    box-shadow:0 0 25px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    color:#FFD700;
    margin-top:0;
}

.back{
    display:inline-block;
    margin-bottom:25px;
    padding:10px 18px;
    border-radius:12px;
    background:#FFD700;
    color:#1e3c72;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}
.back:hover{transform:scale(1.05)}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:18px;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:16px;
    cursor:pointer;
    transition:transform .3s, box-shadow .3s;
}
.gallery img:hover{
    transform:scale(1.04);
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.88);
    align-items:center;
    justify-content:center;
    padding:25px;
}
.modal.show{display:flex}

.modal img{
    max-width:95%;
    max-height:88vh;
    border-radius:16px;
    animation:zoom .25s ease;
}

.close{
    position:absolute;
    top:18px;
    left:25px;
    font-size:40px;
    color:white;
    cursor:pointer;
}

@keyframes zoom{
    from{transform:scale(.75);opacity:0}
    to{transform:scale(1);opacity:1}
}

.empty{
    text-align:center;
    padding:30px;
    color:#eee;
}
</style>
</head>

<body>
<div class="container">
    <a class="back" href="about.html">⬅️ بازگشت به درباره من</a>
    <h1>📸 گالری عکس‌های روزانه من</h1>

    <div class="gallery">
        <img src="images/daily1.jpg" alt="عکس روزانه ۱" onclick="openImage(this.src)">
        <img src="images/daily2.jpg" alt="عکس روزانه ۲" onclick="openImage(this.src)">
        <img src="images/daily3.jpg" alt="عکس روزانه ۳" onclick="openImage(this.src)">
        <img src="images/daily4.jpg" alt="عکس روزانه ۴" onclick="openImage(this.src)">
    </div>
</div>

<div class="modal" id="modal" onclick="closeImage()">
    <span class="close">&times;</span>
    <img id="modalImage" src="" alt="عکس بزرگ‌شده" onclick="event.stopPropagation()">
</div>

<script>
function openImage(src){
    document.getElementById('modalImage').src = src;
    document.getElementById('modal').classList.add('show');
}

function closeImage(){
    document.getElementById('modal').classList.remove('show');
}

document.addEventListener('keydown', function(event){
    if(event.key === 'Escape') closeImage();
});
</script>
</body>
</html>
