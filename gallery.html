<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گالری عکس‌های روزانه من | Gallery Araz Game 📸</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:tahoma,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298);color:white}
.container{width:92%;max-width:1000px;margin:40px auto;padding:30px;background:rgba(255,255,255,.12);border-radius:22px;box-shadow:0 0 25px rgba(0,0,0,.35)}
h1{text-align:center;color:#FFD700;margin-top:0}
.back{display:inline-block;margin-bottom:25px;padding:10px 18px;border-radius:12px;background:#FFD700;color:#1e3c72;text-decoration:none;font-weight:bold;transition:.3s}
.back:hover{transform:scale(1.05)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.gallery img{width:100%;height:220px;object-fit:cover;border-radius:16px;cursor:pointer;transition:transform .3s,box-shadow .3s}
.gallery img:hover{transform:scale(1.04);box-shadow:0 10px 25px rgba(0,0,0,.35)}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:25px}
.modal.show{display:flex}
.modal img{max-width:85%;max-height:88vh;border-radius:16px;animation:zoom .25s ease;object-fit:contain}
.close{position:absolute;top:18px;left:25px;font-size:40px;color:white;cursor:pointer;z-index:1003;line-height:1}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:white;font-size:34px;font-weight:bold;cursor:pointer;z-index:1002;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s,opacity .2s}
.gallery-nav:hover:not(:disabled){background:rgba(255,215,0,.9);color:#1e3c72;transform:translateY(-50%) scale(1.08)}
.gallery-nav:disabled{opacity:.25;cursor:not-allowed}
.gallery-nav[data-tooltip]::after{content:attr(data-tooltip);position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(-4px);background:rgba(0,0,0,.72);color:white;padding:7px 11px;border-radius:8px;font-family:tahoma,sans-serif;font-size:13px;font-weight:normal;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s,transform .18s,visibility .18s;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.gallery-nav:hover:not(:disabled)[data-tooltip]::after,.gallery-nav:focus-visible:not(:disabled)[data-tooltip]::after{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.prev{right:22px}
.next{left:22px}
.photo-count{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:12px;background:rgba(0,0,0,.45);font-size:15px;z-index:1002}
.loading,.empty,.error{text-align:center;padding:30px;color:#eee}
@media(max-width:600px){
  .modal{padding:15px}
  .modal img{max-width:76%;max-height:82vh}
  .gallery-nav{width:48px;height:48px;font-size:29px}
  .prev{right:8px}
  .next{left:8px}
  .close{top:10px;left:14px;font-size:34px}
  .gallery-nav[data-tooltip]::after{font-size:12px;padding:6px 9px}
}
@keyframes zoom{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="container">
<a class="back" href="about.html">⬅️ بازگشت به درباره من</a>
<h1>📸 گالری عکس‌های روزانه من</h1>
<div class="gallery" id="gallery"><div class="loading">لطفا صبر کنید در حال بارگذاری عکس‌ها هستیم... 📷</div></div>
</div>

<div class="modal" id="modal" onclick="closeModal()">
  <span class="close" aria-label="بستن">&times;</span>
  <button class="gallery-nav prev" id="prevBtn" data-tooltip="عکس قبلی" type="button" aria-label="عکس قبلی" onclick="event.stopPropagation();showPrevious()">‹</button>
  <img id="modalImg" src="" alt="عکس بزرگ شده" onclick="event.stopPropagation()">
  <button class="gallery-nav next" id="nextBtn" data-tooltip="عکس بعدی" type="button" aria-label="عکس بعدی" onclick="event.stopPropagation();showNext()">›</button>
  <div class="photo-count" id="photoCount" aria-live="polite"></div>
</div>

<script>
const gallery = document.getElementById('gallery');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const photoCount = document.getElementById('photoCount');

let galleryImages = [];
let currentIndex = 0;

async function loadGallery(){
  const galleryIndexUrl = './gallery.json';
  try{
    const response = await fetch(galleryIndexUrl + '?t=' + Date.now(), {
      cache:'no-store',
      headers:{'Accept':'application/json'}
    });
    if(!response.ok) throw new Error('Gallery index error: ' + response.status);

    const files = await response.json();
    galleryImages = Array.isArray(files) ? files.filter(file => file && file.url) : [];

    gallery.innerHTML = '';

    if(galleryImages.length === 0){
      gallery.innerHTML = '<div class="empty">هنوز عکسی در گالری قرار نگرفته است. 📷</div>';
      return;
    }

    galleryImages.forEach((file,index)=>{
      const card=document.createElement('div');
      card.style.position='relative';

      const img=document.createElement('img');
      img.src=file.url;
      img.alt='عکس آراز '+(index+1);
      img.loading='lazy';
      img.onerror=()=>{ img.style.opacity='.35'; };
      img.onclick=()=>openModal(index);

      card.appendChild(img);
      gallery.appendChild(card);
    });
  }catch(error){
    console.error(error);
    gallery.innerHTML='<div class="error">بارگذاری عکس‌ها با مشکل روبه‌رو شد. لطفاً صفحه را دوباره باز کنید.</div>';
  }
}

function openModal(index){
  if(!galleryImages.length) return;
  currentIndex = index;
  updateModal();
  modal.classList.add('show');
  document.body.style.overflow='hidden';
}

function updateModal(){
  const currentImage = galleryImages[currentIndex];
  if(!currentImage) return;

  modalImg.src=currentImage.url;
  modalImg.alt='عکس آراز '+(currentIndex+1);

  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === galleryImages.length - 1;
  photoCount.textContent = `شماره عکس: ${currentIndex + 1}`;
}

function showPrevious(){
  if(currentIndex > 0){
    currentIndex--;
    updateModal();
  }
}

function showNext(){
  if(currentIndex < galleryImages.length - 1){
    currentIndex++;
    updateModal();
  }
}

function closeModal(){
  modal.classList.remove('show');
  modalImg.src='';
  document.body.style.overflow='';
}

document.addEventListener('keydown',(event)=>{
  if(!modal.classList.contains('show')) return;

  if(event.key === 'Escape') closeModal();
  if(event.key === 'ArrowRight') showPrevious();
  if(event.key === 'ArrowLeft') showNext();
});

loadGallery();
</script>
</body>
</html>
