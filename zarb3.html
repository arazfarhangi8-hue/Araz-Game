<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>بازی آموزش جدول ضرب ۳ | Araz Game</title><style>body{margin:0;font-family:Tahoma,sans-serif;background:#f5f9ff;text-align:center}header{background:linear-gradient(90deg,#0066ff,#ffffff,#ff3333);padding:30px}.box{background:white;width:350px;margin:30px auto;padding:20px;border-radius:15px;box-shadow:0 0 10px gray}input{font-size:20px;width:100px;text-align:center}button{background:#0066ff;color:white;border:none;padding:10px 20px;border-radius:10px;font-size:18px;cursor:pointer;margin:5px}#result{font-size:22px;margin-top:20px;font-weight:bold}</style></head><body><header><h1>🎮 بازی آموزش جدول ضرب ۳</h1><p>با بازی، جدول ضرب را یاد بگیر.</p></header><div class="box"><h2>🎲 ضرب عدد ۳</h2><h1 id="question"></h1><input type="number" id="answer"><br><br><button onclick="check()">✅ بررسی جواب</button><br><br><button onclick="location.href='zarb2.html'">⬅ ضرب ۲</button><button onclick="location.href='zarb4.html'">ضرب ۴ ➡</button><br><br><button onclick="location.href='start.html'">🎮 انتخاب بازی</button><button onclick="location.href='index.html'">🏠 صفحه اصلی</button><h2 id="result"></h2><p>⭐ امتیاز: <span id="score">0</span></p></div><script>
let score=0,n,winAudio=null;
async function audioReady(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!winAudio)winAudio=new A;if(winAudio.state==='suspended')await winAudio.resume();return winAudio}
async function playWinSound(){const c=await audioReady();if(!c)return;const now=c.currentTime,notes=[523.25,659.25,783.99,1046.5,783.99,659.25],times=[0,.12,.24,.36,.52,.68];notes.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=now+times[i];o.type='triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.32,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.11);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.12)})}
async function playLoseSound(){const c=await audioReady();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(105,t+.8);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.28,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.85);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.9)}
function newQuestion(){n=Math.floor(Math.random()*10)+1;question.innerHTML='3 × '+n+' = ؟';answer.value='';answer.focus()}function check(){let ans=parseInt(answer.value);if(ans===3*n){score++;playWinSound();result.innerHTML='✅ آفرین'}else{playLoseSound();result.innerHTML='❌ جواب صحیح: '+(3*n)}document.getElementById('score').innerHTML=score;setTimeout(newQuestion,1000)}newQuestion();</script></body></html>
