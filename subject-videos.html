<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>فیلم‌های درس | Araz Game</title>
<style>
body{margin:0;font-family:Tahoma,sans-serif;background:#f5f9ff;text-align:center}
header{background:linear-gradient(90deg,#0066ff,#fff,#ff3333);padding:25px}
.card{background:#fff;width:92%;max-width:800px;margin:25px auto;padding:22px;border-radius:18px;box-shadow:0 0 12px #ccc}
#status{font-size:19px;margin:18px}.media{max-width:100%;max-height:65vh;border-radius:12px}video{width:100%;max-width:760px;background:#000}
.nav button,.back{background:#0066ff;color:#fff;border:0;padding:13px 22px;border-radius:10px;font-size:18px;margin:8px;cursor:pointer}.nav button:disabled{opacity:.45;cursor:not-allowed}.back{background:#444}
</style></head>
<body>
<header><h1 id="title">🎬 فیلم‌های درس</h1></header>
<div class="card"><div id="status">در حال بارگذاری...</div><div id="media"></div>
<div class="nav" id="nav"><button id="prev" onclick="move(-1)">صفحه قبلی</button><button id="next" onclick="move(1)">صفحه بعدی</button></div>
<br><button class="back" onclick="location.href='class-subjects.html?class='+cls">↩ بازگشت به درس‌ها</button></div>
<script>
const p=new URLSearchParams(location.search),cls=(p.get('class')||'01').padStart(2,'0'),subject=p.get('subject')||'farsi';
const api='https://api.github.com/repos/arazfarhangi8-hue/Araz-Game/contents/videos/educational/class-'+cls+'/'+subject;
let files=[],index=0;
const videoExt=['mp4','webm','ogg','mov','m4v'],imageExt=['jpg','jpeg','png','gif','webp'];
const names={farsi:'فارسی',riazi:'ریاضی',oloom:'علوم',motaleat:'مطالعات اجتماعی',quran:'قرآن',hedye:'هدیه‌های آسمان',arabi:'عربی',english:'انگلیسی',payam:'پیام‌های آسمان',tafakor:'تفکر و سبک زندگی',fizik:'فیزیک',shimi:'شیمی',zist:'زیست‌شناسی',hendese:'هندسه',amar:'آمار و احتمال',hesaban:'حسابان',dini:'دینی'};
function nameOf(n){return n.replace(/\.[^/.]+$/,'').replace(/[-_]+/g,' ').trim()||'فیلم آموزشی'}
async function load(){
 document.getElementById('title').textContent='🎬 فیلم‌های '+(names[subject]||subject)+' کلاس '+parseInt(cls,10);
 try{const r=await fetch(api,{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();files=d.filter(x=>x.type==='file'&&(videoExt.includes(x.name.split('.').pop().toLowerCase())||imageExt.includes(x.name.split('.').pop().toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!files.length){empty();return}show(0)}catch(e){empty()}
}
function empty(){document.getElementById('status').textContent='هنوز هیچ فیلمی منتشر نشده است.';document.getElementById('media').innerHTML='';document.getElementById('nav').style.display='none'}
function show(i){index=i;document.getElementById('status').textContent='در حال بارگذاری...';document.getElementById('media').innerHTML='';setTimeout(()=>{const f=files[index],ext=f.name.split('.').pop().toLowerCase();document.getElementById('status').textContent=nameOf(f.name);document.getElementById('media').innerHTML=videoExt.includes(ext)?'<video class="media" controls playsinline src="'+f.download_url+'"></video>':'<img class="media" src="'+f.download_url+'" alt="'+nameOf(f.name)+'">';document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===files.length-1},500)}
function move(s){if(files.length)show(index+s)}load();
</script></body></html>
