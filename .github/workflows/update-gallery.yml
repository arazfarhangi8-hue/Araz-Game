name: Update gallery index

on:
  push:
    branches: [main]
    paths-ignore:
      - 'gallery.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build gallery.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path('gallery1')
          extensions = {'.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp'}
          files = sorted(
              [p for p in folder.iterdir() if p.is_file() and p.suffix.lower() in extensions],
              key=lambda p: p.name.lower()
          )

          items = [
              {
                  'name': p.name,
                  'url': f'https://raw.githubusercontent.com/arazfarhangi8-hue/Araz-Game/main/gallery1/{p.name}'
              }
              for p in files
          ]

          Path('gallery.json').write_text(
              json.dumps(items, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit gallery index when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery.json
          if git diff --cached --quiet; then
            echo 'gallery.json is already up to date.'
          else
            git commit -m 'Update gallery index'
            git push
          fi
