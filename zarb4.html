<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>بازی آموزش جدول ضرب ۴ | Araz Game</title><style>body{margin:0;font-family:Tahoma,sans-serif;background:#f5f9ff;text-align:center}header{background:linear-gradient(90deg,#0066ff,#ffffff,#ff3333);padding:30px}.box{background:white;width:350px;margin:30px auto;padding:20px;border-radius:15px;box-shadow:0 0 10px gray}input{font-size:20px;width:100px;text-align:center}button{background:#0066ff;color:white;border:none;padding:10px 20px;border-radius:10px;font-size:18px;cursor:pointer;margin:6px}#result{font-size:22px;margin-top:20px;font-weight:bold}</style></head><body><header><h1>🎮 بازی آموزش جدول ضرب ۴</h1><p>یادگیری جدول ضرب با بازی</p></header><div class="box"><h2>🎲 ضرب عدد ۴</h2><h1 id="question"></h1><input type="number" id="answer"><br><br><button onclick="check()">✅ بررسی جواب</button><br><br><button onclick="location.href='zarb3.html'">⬅ ضرب ۳</button><button onclick="location.href='zarb5.html'">ضرب ۵ ➡</button><br><br><button onclick="location.href='start.html'">🎮 انتخاب بازی</button><button onclick="location.href='index.html'">🏠 صفحه اصلی</button><h2 id="result"></h2><p>⭐ امتیاز: <span id="score">0</span></p></div><script>let score=0,n,audioCtx=null;function getAudio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!audioCtx)audioCtx=new A();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function playWinSound(){const c=getAudio();if(!c)return;const t=c.currentTime,notes=[523.25,659.25,783.99,1046.5,783.99,659.25];notes.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),x=t+i*.13;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,x);g.gain.exponentialRampToValueAtTime(.35,x+.025);g.gain.exponentialRampToValueAtTime(.001,x+.12);o.connect(g);g.connect(c.destination);o.start(x);o.stop(x+.13)})}function playLoseSound(){const c=getAudio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(90,t+.75);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.4,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.8);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.82)}function newQuestion(){n=Math.floor(Math.random()*10)+1;document.getElementById('question').innerHTML='4 × '+n+' = ؟';document.getElementById('answer').value='';document.getElementById('answer').focus()}function check(){let ans=parseInt(document.getElementById('answer').value);if(ans===4*n){score++;playWinSound();document.getElementById('result').innerHTML='✅ آفرین!'}else{playLoseSound();document.getElementById('result').innerHTML='❌ جواب صحیح: '+(4*n)}document.getElementById('score').innerHTML=score;setTimeout(newQuestion,1000)}newQuestion();</script></body></html>
